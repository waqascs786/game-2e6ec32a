name: Build & Preview Game

on:
  workflow_dispatch:
    inputs:
      game_id:
        description: 'Game ID'
        required: true
      game_name:
        description: 'Game Name'
        required: true
      user_email:
        description: 'User email for notifications'
        required: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      public_key: ${{ steps.upload.outputs.public_key }}
      apk_url: ${{ steps.release.outputs.apk_url }}
      aab_url: ${{ steps.release.outputs.aab_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.4
          channel: stable

      - name: Save source files
        run: |
          mkdir -p /tmp/saved
          cp -r lib /tmp/saved/lib
          cp pubspec.yaml /tmp/saved/pubspec.yaml
          cp pubspec.lock /tmp/saved/pubspec.lock 2>/dev/null || true

      - name: Create Flutter scaffold in workspace
        run: |
          ORG="com.game19"
          PROJ="android"
          flutter create --org "$ORG" --project-name "$PROJ" . 2>&1 | tail -5

      - name: Restore source files
        run: |
          rm -rf lib
          cp -r /tmp/saved/lib .
          cp /tmp/saved/pubspec.yaml .
          cp /tmp/saved/pubspec.lock . 2>/dev/null || true
          echo "=== Verify ==="
          ls -la lib/main.dart
          head -3 lib/main.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Set app name
        run: |
          python3 - << 'PY'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          with open(p) as f: c = f.read()
          c = re.sub(r'android:label="[^"]*"', 'android:label="Game 19"', c)
          with open(p, 'w') as f: f.write(c)
          print('App name set to: Game 19')
          PY

      - name: Decode signing keystore
        run: echo "" | base64 -d > /tmp/release.jks

      - name: Configure Android signing
        run: |
          python3 -c "
          import re
          with open('android/app/build.gradle') as f: c = f.read()
          if 'signingConfigs' in c:
              print('Signing already configured')
          else:
              signing = '\n    signingConfigs {\n        release {\n            keyAlias = \'platform_release\'\n            keyPassword = \'QuizNinja2024!\'\n            storeFile = file(\'/tmp/release.jks\')\n            storePassword = \'QuizNinja2024!\'\n        }\n    }\n'
              c = c.replace('android {', 'android {' + signing, 1)
              c = c.replace('signingConfig = signingConfigs.debug', 'signingConfig = signingConfigs.release')
              with open('android/app/build.gradle', 'w') as f: f.write(c)
              print('Signing configured')
          "

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Build Android release APK
        run: flutter build apk --release

      - name: Build Android release AAB
        run: flutter build appbundle --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Create GitHub Release with downloads
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="release-${{ github.event.inputs.game_id }}"
          gh release delete "$TAG" --repo "${{ github.repository }}" -y 2>/dev/null || true
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Build: ${{ github.event.inputs.game_name }}" \
            --notes "Automated build for ${{ github.event.inputs.game_name }}" \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/bundle/release/app-release.aab
          APK_URL="https://github.com/${{ github.repository }}/releases/download/$TAG/app-release.apk"
          AAB_URL="https://github.com/${{ github.repository }}/releases/download/$TAG/app-release.aab"
          echo "apk_url=$APK_URL" >> $GITHUB_OUTPUT
          echo "aab_url=$AAB_URL" >> $GITHUB_OUTPUT

      - name: Upload APK to Appetize.io
        id: upload
        env:
          APPETIZE_TOKEN: ${{ secrets.APPETIZE_TOKEN }}
        run: |
          SHORT_ID="${{ github.event.inputs.game_id }}"
          SHORT_ID="${SHORT_ID%%-*}"
          SHORT_ID="${SHORT_ID:0:20}"
          RESPONSE=$(curl -s -X POST \
            -H "X-API-KEY: $APPETIZE_TOKEN" \
            -F "file=@build/app/outputs/flutter-apk/app-release.apk" \
            -F "platform=android" \
            -F "tags[]=$SHORT_ID" \
            https://api.appetize.io/v2/builds)
          echo "Android response: $RESPONSE"
          BUILD_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")
          echo "public_key=$BUILD_ID" >> $GITHUB_OUTPUT

  notify:
    needs: [build-android]
    if: always() && needs.build-android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Write email script
        run: |
          cat > /tmp/send_email.py << "ENDSCRIPT"
          import smtplib, os
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart
          game_name = os.environ["GAME_NAME"]
          user_email = os.environ["USER_EMAIL"]
          android_url = os.environ["ANDROID_URL"]
          apk_url = os.environ.get("APK_URL", "")
          aab_url = os.environ.get("AAB_URL", "")
          game_id = os.environ["GAME_ID"]
          gmail_pass = os.environ["GMAIL_APP_PASSWORD"]
          html = "<h2>Your game is ready!</h2>"
          html += "<p><b>" + game_name + "</b> has been built and is ready to preview on Appetize.io.</p>"
          html += "<h3>Live Preview</h3>"
          html += "<p><b>Android:</b> <a href='" + android_url + "'>" + android_url + "</a></p>"
          html += "<h3>Download Builds</h3>"
          if apk_url:
              html += "<p><b>Android APK:</b> <a href='" + apk_url + "'>Download APK</a></p>"
          if aab_url:
              html += "<p><b>Play Store AAB:</b> <a href='" + aab_url + "'>Download AAB</a> (submit to Play Console)</p>"
          html += "<hr><p><small>Game ID: " + game_id + "</small></p>"
          msg = MIMEMultipart("alternative")
          msg["Subject"] = "Game Build Ready: " + game_name
          msg["From"] = "Quiz Game Builder <waqascsme@gmail.com>"
          msg["To"] = user_email
          msg.attach(MIMEText(html, "html"))
          server = smtplib.SMTP("smtp.gmail.com", 587)
          server.starttls()
          server.login("waqascsme@gmail.com", gmail_pass)
          server.sendmail("waqascsme@gmail.com", user_email, msg.as_string())
          server.quit()
          print("Email sent to " + user_email)
          ENDSCRIPT

      - name: Send email via Gmail SMTP
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GAME_NAME: ${{ github.event.inputs.game_name }}
          USER_EMAIL: ${{ github.event.inputs.user_email }}
          GAME_ID: ${{ github.event.inputs.game_id }}
          ANDROID_KEY: ${{ needs.build-android.outputs.public_key }}
          APK_URL: ${{ needs.build-android.outputs.apk_url }}
          AAB_URL: ${{ needs.build-android.outputs.aab_url }}
        run: |
          if [ -z "$USER_EMAIL" ]; then
            echo "No user email, skipping notification"
            exit 0
          fi
          export ANDROID_URL="https://appetize.io/app/$ANDROID_KEY?autoplay=true"
          if [ -z "$GMAIL_APP_PASSWORD" ]; then
            echo "No Gmail app password, skipping email"
            echo "::notice::Android Preview: $ANDROID_URL"
            exit 0
          fi
          python3 /tmp/send_email.py

      - name: Print preview links
        if: always()
        env:
          ANDROID_KEY: ${{ needs.build-android.outputs.public_key }}
        run: |
          echo "=========================================="
          echo "  GAME BUILD COMPLETE!"
          echo "=========================================="
          echo "Android: https://appetize.io/app/$ANDROID_KEY"
          echo "=========================================="
          echo "::notice::Android Preview: https://appetize.io/app/$ANDROID_KEY"